name: Release

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:

jobs:
  create-release:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./
      - uses: actions/deploy-pages@v5
        id: deployment
      